[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/"
]
optimizer = true
optimizer_runs = 200
solc_version = "0.8.24"

fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 1000

[profile.ci]
fuzz = { runs = 5000 }

# Arc (Circle) — USDC is the native gas token, 18 decimals at the EVM level.
# Testnet faucet: https://faucet.circle.com  Docs: https://docs.arc.io
# If fee estimation misbehaves, retry `forge script` with --legacy.
# Do not add [etherscan] entries for 5042002/5042 until Foundry ships native chain
# metadata — unknown chain IDs break `forge script`. See docs/arc.md for verify notes.
[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
arc_mainnet = "https://rpc.mainnet.arc.io"
