# A second bonded oracle operator in checker mode, shaped for a bare VPS.
#
# Use THIS file when the box has no repository checkout, which is how the Sigvara
# oracles are actually deployed. Use docker-compose.checker.yml instead when you have
# a checkout and want to build from local source.
#
# The difference matters and has caused real mistakes: docker-compose.checker.yml has
# a `build: context: ./oracle` and implies a working tree on the host. This file has
# no build stage. It fetches ONE PINNED COMMIT of the public repository inside the
# container, the same way the primary does. Nothing on the host to `git pull`, nothing
# to rebuild.
#
# Which code runs is decided by SIGVARA_COMMIT in .env: the full 40-character hash of a
# commit on main that someone has read. It used to be "whatever main is when the container
# starts", so a crash, a reboot or a Docker restart deployed the head of main next to the
# signing key. Use the SAME hash as the primary: a checker on different code disagrees with
# the primary about agents and reports it as a divergence in the primary. A deploy is:
#
#   1. change SIGVARA_COMMIT in .env
#   2. docker compose -f docker-compose.checker.vps.yml up -d
#   3. read /health: "commit" must equal what you set
#
#   scp this file and .env to /docker/sigvara-checker/ on the checker box
#   cd /docker/sigvara-checker && docker compose -f docker-compose.checker.vps.yml up -d
#
# No reverse proxy lives in this file. The watcher needs /health and /divergence from a
# third host, but whatever already terminates 80/443 on the box should serve them: on the
# first deployment that was a system nginx, and a second server fighting it for the port
# is not an improvement. See oracle/nginx-checker.conf.example. Set TRUSTED_PROXIES in .env
# to the address that proxy reaches the container from (the gateway of this project's
# network, usually 172.x.0.1, see `docker network inspect sigvara-checker_default`), or every
# visitor shares one rate-limit bucket.
#
# `up -d` on first run, and after any .env change. A plain `restart` re-runs the fetch of
# the pinned commit but does NOT re-read env_file.
#
# Prerequisites, all of them, in oracle/RUNBOOK-second-operator.md: the wallet needs
# its own 25,000 SVR bond, admission to the operator set, and ORACLE_ROLE. A checker
# that is not an admitted operator starts and logs a warning rather than failing, so
# confirm step 4 landed rather than assuming a clean start means a working one.
services:
  checker:
    image: node:20-alpine
    container_name: sigvara-checker
    restart: unless-stopped
    working_dir: /app
    init: true
    env_file:
      - .env
    environment:
      SIGVARA_COMMIT: ${SIGVARA_COMMIT:?set SIGVARA_COMMIT in .env to the full 40-character commit hash}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    mem_limit: 768m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3030) + '/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 60s
      timeout: 5s
      start_period: 180s
      retries: 3
    command:
      - sh
      - -c
      - |
        set -eu
        case "$${SIGVARA_COMMIT:-}" in ""|*[!0-9a-f]*) echo "[deploy] SIGVARA_COMMIT must be 40 lowercase hex characters" >&2; exit 1;; esac
        [ "$${#SIGVARA_COMMIT}" -eq 40 ] || { echo "[deploy] SIGVARA_COMMIT must be 40 characters" >&2; exit 1; }
        apk add --no-cache git >/dev/null
        rm -rf /src && mkdir /src && cd /src
        git init -q
        git remote add origin https://github.com/RunTimeAdmin/Sigvara.git
        git fetch -q --depth 1 origin "$$SIGVARA_COMMIT"
        git checkout -q --detach FETCH_HEAD
        [ "$$(git rev-parse HEAD)" = "$$SIGVARA_COMMIT" ] || { echo "[deploy] checkout is not $$SIGVARA_COMMIT, refusing to start" >&2; exit 1; }
        rm -rf /app/node_modules /app/*.js /app/package.json /app/package-lock.json
        cp /src/oracle/*.js /src/oracle/package.json /src/oracle/package-lock.json /app/
        rm -f /app/*.test.js
        cd /app
        # npm ci installs exactly the committed lockfile; --ignore-scripts keeps dependencies
        # from running code at install time with the signing key in the environment.
        npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        echo "[deploy] running $$SIGVARA_COMMIT"
        exec node index.js
    ports:
      # 3031 on the host to match the verification commands in the runbook, and so that
      # a checker and a primary can coexist on one box during a migration without the
      # second silently failing to bind.
      - "127.0.0.1:3031:3030"
    volumes:
      # Its OWN state. Sharing the primary's would mean sharing the payment observations
      # the score is computed from, which is most of what is being checked. Back it up:
      # docs/operations-runbook.md, section 1.
      - checker_state:/data
      - checker_app:/app

volumes:
  checker_state:
  checker_app:
