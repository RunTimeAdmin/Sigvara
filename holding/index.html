<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sigvara</title>

<meta property="og:title" content="Sigvara">
<meta property="og:description" content="Signed attestations, staked reputation, and slashing for autonomous agents. Built on ERC-8004, deploying on Arc.">
<meta property="og:url" content="https://sigvara.xyz/">

<meta name="twitter:site" content="@defiauditccie">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b0f14'/%3E%3Cpath d='M20 44 L32 18 L44 44 M25 36 H39' stroke='%23e8c46a' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0f14;
    --bg2: #10161e;
    --fg: #e6e9ee;
    --muted: #8b95a5;
    --line: #1f2937;
    --accent: #e8c46a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #17202b 0%, var(--bg) 60%);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 16px;
  }
  .card {
    max-width: 640px;
    width: 100%;
  }
  .mark {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }
  .mark svg { width: 44px; height: 44px; }
  .mark span {
    font-size: 13px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    font-size: clamp(40px, 8vw, 64px);
    line-height: 1;
    margin: 0 0 18px;
    letter-spacing: -.02em;
    font-weight: 700;
  }
  h1 em { font-style: normal; color: var(--accent); }
  p.lede {
    font-size: 19px;
    line-height: 1.5;
    color: #c5cbd6;
    margin: 0 0 12px;
  }
  p.sub {
    font-size: 15px;
    line-height: 1.6;
    color: var(--muted);
    margin: 0 0 32px;
  }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .92em;
    color: var(--fg);
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 2px 6px;
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 40px;
  }
  a.btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--fg);
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 15px;
    transition: border-color .15s, transform .15s;
  }
  a.btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  a.btn svg { width: 18px; height: 18px; fill: currentColor; }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
    border-top: 1px solid var(--line);
    padding-top: 20px;
    width: 100%;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(232,196,106,.6);
    animation: pulse 2.4s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(232,196,106,.55); }
    70% { box-shadow: 0 0 0 10px rgba(232,196,106,0); }
    100% { box-shadow: 0 0 0 0 rgba(232,196,106,0); }
  }
  footer {
    text-align: center;
    font-size: 12px;
    color: #5f6b7c;
    padding: 20px 16px 28px;
  }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#10161e" stroke="#1f2937"/><path d="M20 44 L32 18 L44 44 M25 36 H39" stroke="#e8c46a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Protocol</span>
    </div>

    <h1>Sig<em>vara</em></h1>

    <p class="lede">Signed attestations, staked reputation, and slashing for autonomous agents.</p>
    <p class="sub">Built on <code>ERC-8004</code>. Deploying on Arc.</p>

    <div class="row">
      <a class="btn" href="https://github.com/RunTimeAdmin/sigvara" rel="noopener">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        Source
      </a>
      <a class="btn" href="https://x.com/defiauditccie" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        Updates
      </a>
    </div>

    <div class="status"><span class="dot"></span> Arc mainnet port in progress</div>
  </div>
</main>
<footer>
  <a href="https://protocol14019.com/" rel="noopener">protocol14019</a> &middot; 2026
</footer>
</body>
</html>
