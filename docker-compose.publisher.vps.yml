# ERC-8004 publisher, shaped for a bare VPS (oracle/publisher.js, docs/adr/0008).
#
# Like the watcher, this fetches ONE PINNED COMMIT of the public repository inside the
# container. Which code runs is decided by SIGVARA_COMMIT in .env: the full 40-character hash
# of a commit on main that someone has read. A deploy is:
#
#   1. change SIGVARA_COMMIT in .env
#   2. docker compose up -d        (a plain restart does NOT re-read .env)
#   3. read the log: "[deploy] running <that hash>", then "[publisher] shadow mode" or "live mode"
#
# Run exactly one, beside the primary. The checker never runs one: a second publisher with the
# same key races the first for nonces, and one with another key is a second, unnamed provider.
#
# It holds no private key. In shadow mode (the default) it signs nothing at all; in live mode it
# asks the remote signer on another host, through the signer-tunnel service below (oracle/signer.js; on testnet an
# encrypted keystore, on mainnet a KMS or HSM). A compromised publisher host can ask for signatures while it is compromised but cannot
# take the key away. The state volume holds what it has read and posted. Its scan positions can
# be rebuilt from the chain; its record of which 8004 agent each score went to cannot, and without
# it a score left on an 8004 agent that is no longer linked stays there. Back the volume up.
#
#   cd /docker/sigvara-publisher && docker compose up -d
services:
  publisher:
    image: node:24-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53
    container_name: sigvara-publisher
    restart: unless-stopped
    working_dir: /app
    init: true
    env_file:
      - .env
    environment:
      SIGVARA_COMMIT: ${SIGVARA_COMMIT:?set SIGVARA_COMMIT in .env to the full 40-character commit hash}
      PUBLISH_STATE_PATH: /data/publisher-state.json
      PUBLISH_SIGNER_URL: http://signer-tunnel:28600
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    command:
      - sh
      - -c
      - |
        set -eu
        case "$${SIGVARA_COMMIT:-}" in ""|*[!0-9a-f]*) echo "[deploy] SIGVARA_COMMIT must be 40 lowercase hex characters" >&2; exit 1;; esac
        [ "$${#SIGVARA_COMMIT}" -eq 40 ] || { echo "[deploy] SIGVARA_COMMIT must be 40 characters" >&2; exit 1; }
        apk add --no-cache git >/dev/null
        rm -rf /src && mkdir /src && cd /src
        git init -q
        git remote add origin https://github.com/RunTimeAdmin/Sigvara.git
        git fetch -q --depth 1 origin "$$SIGVARA_COMMIT"
        git checkout -q --detach FETCH_HEAD
        [ "$$(git rev-parse HEAD)" = "$$SIGVARA_COMMIT" ] || { echo "[deploy] checkout is not $$SIGVARA_COMMIT, refusing to start" >&2; exit 1; }
        rm -rf /app/node_modules /app/*.js /app/package.json /app/package-lock.json
        cp /src/oracle/*.js /src/oracle/package.json /src/oracle/package-lock.json /app/
        rm -f /app/*.test.js
        cd /app
        # npm ci installs exactly the committed lockfile; --ignore-scripts keeps dependencies
        # from running code at install time.
        npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        echo "[deploy] running $$SIGVARA_COMMIT"
        exec node publisher.js
    volumes:
      - publisher_app:/app
      - publisher_state:/data

  # The only way to the signer: an SSH local forward over the SSH port its host already opens, to
  # the signer listening on that host's 127.0.0.1 alone. The key works only from this host, and
  # that host's sshd lets its account open that one forward and nothing else (runbook section 5,
  # step 1; oracle/sshd_config.signer-tunnel). The host key is pinned in known_hosts, so requests
  # and the signed transactions they return are encrypted, and go to that host or nowhere. The
  # publisher reaches it as signer-tunnel:28600 on this project's network; nothing is published on
  # the host. ./secrets/tunnel holds id_ed25519 and known_hosts, owned by root and readable by it
  # alone. A dropped link is retried in place, waiting longer each time it fails quickly, so a bad
  # key does not hammer that host's sshd (and its fail2ban) from the address the backups use.
  signer-tunnel:
    image: alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
    container_name: sigvara-signer-tunnel
    restart: unless-stopped
    init: true
    environment:
      SIGNER_SSH: ${SIGNER_SSH:?set SIGNER_SSH in .env to user@host of the signer's tunnel account}
    security_opt:
      - no-new-privileges:true
    # Root only to install ssh and hand a copy of the key to uid 10002; then su-exec drops to it,
    # and ssh runs with no capabilities at all.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /run/tunnel:size=64k,mode=0700
    mem_limit: 64m
    pids_limit: 32
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    command:
      - sh
      - -c
      - |
        set -eu
        apk add --no-cache openssh-client su-exec >/dev/null
        # ssh refuses a uid with no passwd entry. This one owns nothing but the copies below.
        grep -q '^tunnel:' /etc/passwd || adduser -D -H -h /run/tunnel -s /sbin/nologin -u 10002 tunnel
        # The files are root's, read-only here. Copied while root still owns the folder, then
        # handed over: chmod before chown, as root without CAP_FOWNER cannot chmod what it gave away.
        for f in id_ed25519 known_hosts; do
          cp "/tunnel/$$f" "/run/tunnel/$$f"
          chmod 0400 "/run/tunnel/$$f"
          chown 10002:10002 "/run/tunnel/$$f"
        done
        chown 10002:10002 /run/tunnel
        cat > /usr/local/bin/signer-tunnel <<'EOF'
        delay=60
        while :; do
          echo "[tunnel] forwarding signer-tunnel:28600 to 127.0.0.1:28600 on $$SIGNER_SSH, as uid $$(id -u)"
          started=$$(date +%s)
          ssh -N -T -i /run/tunnel/id_ed25519 \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/run/tunnel/known_hosts \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -L 0.0.0.0:28600:127.0.0.1:28600 "$$SIGNER_SSH" || true
          # A link that held for five minutes was fine: start the wait over.
          if [ $$(( $$(date +%s) - started )) -gt 300 ]; then delay=60; fi
          echo "[tunnel] ssh ended; again in $$delay s"
          sleep "$$delay"
          delay=$$(( delay * 2 > 900 ? 900 : delay * 2 ))
        done
        EOF
        exec su-exec 10002:10002 sh /usr/local/bin/signer-tunnel
    volumes:
      - ./secrets/tunnel:/tunnel:ro

volumes:
  publisher_app:
  publisher_state:
