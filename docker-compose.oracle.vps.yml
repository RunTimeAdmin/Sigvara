# The primary oracle, shaped for a bare VPS.
#
# Use THIS file when the box has no repository checkout, which is how the primary is
# actually deployed. docker-compose.oracle.yml builds from ./oracle and needs a working
# tree; this one fetches ONE PINNED COMMIT of the public repository inside the container.
#
# Which code runs is decided by SIGVARA_COMMIT in .env: the full 40-character hash of a
# commit on main that someone has read. This file used to clone whatever main was when the
# container started, which meant a crash, a reboot or a Docker restart deployed the head of
# main next to the signing key, as root, with nobody having read it. Now a restart runs the
# commit it ran before, and a deploy is a deliberate edit:
#
#   1. change SIGVARA_COMMIT in .env
#   2. docker compose up -d        (a plain restart does NOT re-read .env)
#   3. read /health: "commit" must equal what you set
#
# The start still needs GitHub, the Alpine mirror and the npm registry. If one is down the
# container exits instead of running something else. A SHA alone does not prove the commit
# is on main (GitHub serves any commit in the fork network by hash), so take the hash from
# `git rev-parse origin/main` in a checkout you have read, not from a link.
#
# This file existed only on the host until 21 Sep 2026. The repo carried
# docker-compose.oracle.yml, which builds an image and is not what runs, so the artifact
# in production had no reviewed source and drifted from the checker: when the checker
# moved to `npm ci`, the primary was left on `npm install` and nobody could see it by
# reading the repo. Keep the two files in step, and change them here rather than on the
# box.
#
# On the host this is installed as /docker/sigvara-oracle/docker-compose.yml, the name
# compose looks for by default, so no -f is needed there. The checker keeps its repo
# filename instead and does need one; the two boxes differ and the runbook says so.
#
#   cd /docker/sigvara-oracle && docker compose -p sigvara-oracle up -d
services:
  oracle:
    image: node:20-alpine
    container_name: sigvara-oracle
    restart: unless-stopped
    working_dir: /app
    # tini as PID 1, so `docker stop` ends node on SIGTERM instead of waiting ten seconds
    # for a SIGKILL.
    init: true
    env_file:
      - .env
    environment:
      SIGVARA_COMMIT: ${SIGVARA_COMMIT:?set SIGVARA_COMMIT in .env to the full 40-character commit hash}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    # Measured at 31 MiB and 11 processes on 24 Oct 2026. The limits stop a leak or a slow
    # request body from taking the whole host with it.
    mem_limit: 768m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3030) + '/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 60s
      timeout: 5s
      start_period: 180s
      retries: 3
    command:
      - sh
      - -c
      - |
        set -eu
        case "$${SIGVARA_COMMIT:-}" in ""|*[!0-9a-f]*) echo "[deploy] SIGVARA_COMMIT must be 40 lowercase hex characters" >&2; exit 1;; esac
        [ "$${#SIGVARA_COMMIT}" -eq 40 ] || { echo "[deploy] SIGVARA_COMMIT must be 40 characters" >&2; exit 1; }
        apk add --no-cache git >/dev/null
        rm -rf /src && mkdir /src && cd /src
        git init -q
        git remote add origin https://github.com/RunTimeAdmin/Sigvara.git
        git fetch -q --depth 1 origin "$$SIGVARA_COMMIT"
        git checkout -q --detach FETCH_HEAD
        [ "$$(git rev-parse HEAD)" = "$$SIGVARA_COMMIT" ] || { echo "[deploy] checkout is not $$SIGVARA_COMMIT, refusing to start" >&2; exit 1; }
        # Start from an empty /app so a file from an earlier deploy cannot survive.
        rm -rf /app/node_modules /app/*.js /app/package.json /app/package-lock.json
        cp /src/oracle/*.js /src/oracle/package.json /src/oracle/package-lock.json /app/
        rm -f /app/*.test.js
        cd /app
        # npm ci, not install: ci installs exactly the committed lockfile and fails loudly if
        # the two have drifted. --ignore-scripts: no dependency runs code at install time with
        # the signing key in the environment (none of the locked production packages has an
        # install script, so this costs nothing).
        npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        echo "[deploy] running $$SIGVARA_COMMIT"
        exec node index.js
    ports:
      # Loopback only. The public surface is whatever terminates TLS on the box.
      - "127.0.0.1:3030:3030"
    networks:
      - default
      # Shared with Caddy so it can reach the oracle without a host port. Set TRUSTED_PROXIES
      # in .env to this network's subnet (docker network inspect sigvara-web), or every
      # visitor shares one rate-limit bucket.
      - sigvara-web
    volumes:
      # oracle_state holds paymentEvents, which a rescan cannot rebuild: attestations
      # arrive over HTTP, not from the chain. Losing this volume means re-seeding every
      # settlement by hand, so it outlives container recreates on purpose. Back it up:
      # docs/incident-operator-key.md.
      - oracle_state:/data
      - oracle_app:/app

volumes:
  oracle_state:
  oracle_app:

networks:
  sigvara-web:
    external: true
