# Include this inside the HTTPS server block for sigvara.xyz.
# Only enable HSTS after HTTPS is confirmed for every subdomain.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://oracle.sigvara.xyz; font-src 'self'; connect-src 'self' https://rpc.testnet.arc.io; upgrade-insecure-requests" always;

location = /.well-known/security.txt {
    default_type text/plain;
    add_header Cache-Control "public, max-age=86400";
}
