name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contracts (forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # lib/ is gitignored (not vendored, not submodules), so CI fetches the
      # Solidity deps at the versions foundry.toml's remappings expect.
      # OZ is pinned to v5.6.1; forge-std tracks its default branch (test-only
      # scaffolding, stable cheatcode API).
      - name: Fetch Solidity dependencies
        run: |
          git clone --depth 1 --branch v5.6.1 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts
          git clone --depth 1 --branch v5.6.1 https://github.com/OpenZeppelin/openzeppelin-contracts-upgradeable.git lib/openzeppelin-contracts-upgradeable
          git clone --depth 1 https://github.com/foundry-rs/forge-std.git lib/forge-std

      - name: Build
        run: forge build --sizes

      - name: Test (ci profile — 5000 fuzz runs)
        env:
          FOUNDRY_PROFILE: ci
        run: forge test -vvv

  sdk:
    name: SDK (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm test

  oracle:
    name: Oracle (node --test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oracle
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: node --test

      # Runs here because this job already has node and ethers installed. The check
      # reads src/*.sol and asserts the site and docs still describe it accurately:
      # selectors, the status enum, published addresses, and claims that were true
      # once. All of those drifted silently before anything was watching them.
      - name: Docs and site match the contracts
        working-directory: .
        run: node scripts/check-docs.mjs

      # The site's response headers were defined in four files, of which one was live.
      # Editing the policy meant editing four places by hand, and two untracked copies
      # of the site had already drifted to allowing 'unsafe-inline'. This fails the
      # build if a second source reappears or the live policy loses a directive.
      - name: One source of response headers
        working-directory: .
        run: node scripts/check-headers.mjs

  slither:
    name: Static analysis (slither)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch Solidity dependencies
        run: |
          git clone --depth 1 --branch v5.6.1 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts
          git clone --depth 1 --branch v5.6.1 https://github.com/OpenZeppelin/openzeppelin-contracts-upgradeable.git lib/openzeppelin-contracts-upgradeable
          git clone --depth 1 https://github.com/foundry-rs/forge-std.git lib/forge-std

      # Fails the build on High findings only. Medium/Low are reviewed by hand;
      # the accepted ones are recorded in docs/adr/0002-analyzer-accepted-findings.md.
      - uses: crytic/slither-action@v0.4.1
        with:
          fail-on: high
          slither-args: --filter-paths "lib/|test/|script/|archive/" --exclude-dependencies
