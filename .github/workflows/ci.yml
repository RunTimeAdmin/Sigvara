name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repository or the API.
permissions:
  contents: read

# A newer push to a pull request replaces the run still going for it. A push to main gets a group of its
# own, so a burst of merges does not leave GitHub cancelling the pending ones: every merge commit keeps
# its own result.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Contracts (forge)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1

      # lib/ is gitignored (not vendored, not submodules), so CI fetches the
      # Solidity deps at the versions foundry.toml's remappings expect. Each is
      # fetched by commit, and the commits live in scripts/fetch-deps.sh.
      - name: Fetch Solidity dependencies
        run: sh scripts/fetch-deps.sh

      - name: Build
        run: forge build --sizes

      - name: Test (ci profile — 5000 fuzz runs)
        env:
          FOUNDRY_PROFILE: ci
        run: forge test -vvv

  sdk:
    name: SDK (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build

      # The build compiles src only, and vitest strips types without checking them, so a test that calls
      # the SDK wrongly passes both. This checks the tests against the same types as the sources.
      - run: npm run typecheck
      - run: npm test

  oracle:
    name: Oracle (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: oracle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
      - run: npm ci
      - run: node --test

      # Runs here because this job already has node and ethers installed. The check
      # reads src/*.sol and asserts the site and docs still describe it accurately:
      # selectors, the status enum, published addresses, and claims that were true
      # once. All of those drifted silently before anything was watching them.
      - name: Docs and site match the contracts
        working-directory: .
        run: node scripts/check-docs.mjs

      # The site's response headers were defined in four files, of which one was live.
      # Editing the policy meant editing four places by hand, and two untracked copies
      # of the site had already drifted to allowing 'unsafe-inline'. This fails the
      # build if a second source reappears or the live policy loses a directive.
      - name: One source of response headers
        working-directory: .
        run: node scripts/check-headers.mjs

      # The evidence fixture in the contract tests is the only thing checking that
      # oracle/merkle.js and the contract agree on leaf encoding, pair ordering and
      # odd-node handling. A disagreement passes both suites and fails only in
      # production, so the fixture is regenerated here and compared.
      - name: Evidence fixture matches the oracle
        working-directory: .
        run: node scripts/check-evidence-fixture.mjs

      # The payment-outcome vectors are what the oracle, the SDK and test/PaymentOutcome.t.sol
      # each check signing and verifying against. They are regenerated here from the oracle's
      # type and the testnet deployment, so the JSON and the Solidity copy cannot drift apart.
      - name: Payment-outcome vectors match the oracle
        working-directory: .
        run: node scripts/check-outcome-vectors.mjs

      # A raw private key is 64 hex characters, which GitHub's push protection does not
      # recognise, and a key pushed to this public repository cannot be taken back. This reads
      # every tracked file for a PEM key block or a 64-hex value assigned to a key-like name.
      - name: No private key in tracked files
        working-directory: .
        run: node scripts/check-secrets.mjs --self-test && node scripts/check-secrets.mjs

  slither:
    name: Static analysis (slither)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Fetch Solidity dependencies
        run: sh scripts/fetch-deps.sh

      # Fails the build on High findings only. Medium/Low are reviewed by hand;
      # the accepted ones are recorded in docs/adr/0002-analyzer-accepted-findings.md.
      - uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f # v0.4.2
        with:
          fail-on: high
          slither-args: --filter-paths "lib/|test/|script/|archive/" --exclude-dependencies
