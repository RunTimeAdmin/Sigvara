# Version updates are proposed monthly and merged by hand. Do not turn on auto-merge for any
# of these: the testnet servers run the commit named by SIGVARA_COMMIT, and that pin moves by
# hand after someone has read what main holds, so an auto-merged bump would reach it unread.
# The cooldown keeps a release that is only days old
# (and so not yet pulled by the registry if it was malicious) out of a proposal.
version: 2
updates:
  - package-ecosystem: npm
    directory: /oracle
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /packages/sdk
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /oracle
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
